services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - TOR_ENABLED=true
      - TOR_HOSTNAME_FILE=/var/lib/tor/drelm/hostname
    volumes:
      - /var/lib/tor/drelm/hostname:/var/lib/tor/drelm/hostname:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.onion.conf:/etc/nginx/conf.d/default.conf:ro
      - ../packages/client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server
